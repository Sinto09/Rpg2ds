name: Compiler le jeu 3DS

on:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer les bibliothèques 3DS
        run: dkp-pacman -Syu --noconfirm 3ds-dev || echo "Installation ignorée (déjà présent ?)"

      - name: Compiler le .3dsx
        run: make

      - name: Créer l'icône, la bannière, le son et la fiche du jeu
        shell: bash
        run: |
          mkdir -p cia_assets
          echo "" | base64 -d > cia_assets/icon.png
          echo "" | base64 -d > cia_assets/banner.png
          # son silencieux : 1 seconde, 8000 Hz, 16 bits, mono
          {
            printf 'RIFF\xa4\x3e\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00\x40\x1f\x00\x00\x80\x3e\x00\x00\x02\x00\x10\x00data\x80\x3e\x00\x00'
            head -c 16000 /dev/zero
          } > cia_assets/audio.wav
          cat > cia_assets/app.rsf <<'RSF'
          BasicInfo:
            Title                   : "RPG 2DS"
            ProductCode             : "CTR-P-RPGD"
            Logo                    : Licensed

          TitleInfo:
            Category                : Application
            UniqueId                : 0x7F2D5

          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            MediaFootPadding        : false
            EnableCrypt             : false
            EnableCompress          : true

          AccessControlInfo:
            CoreVersion             : 2
            DescVersion             : 2
            ReleaseKernelMajor      : "02"
            ReleaseKernelMinor      : "33"
            UseExtSaveData          : false

            FileSystemAccess:
              - CategoryFileSystemTool
              - DirectSdmc

            MemoryType              : Application
            SystemMode              : 64MB
            IdealProcessor          : 0
            AffinityMask            : 1
            Priority                : 16
            MaxCpu                  : 0x9E
            HandleTableSize         : 0x200
            DisableDebug            : false
            EnableForceDebug        : false
            CanWriteSharedPage      : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory    : true
            RunnableOnSleep         : false
            SpecialMemoryArrange    : true

            SystemModeExt           : Legacy
            CpuSpeed                : 268MHz
            EnableL2Cache           : true
            CanAccessCore2          : true

            IORegisterMapping:
              - 1ff00000-1ff7ffff
            MemoryMapping:
              - 1f000000-1f5fffff:r

            SystemCallAccess:
              ArbitrateAddress: 34
              Backdoor: 123
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              ControlProcessMemory: 112
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37

            ServiceAccessControl:
              - APT:U
              - ac:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - cfg:nor
              - cfg:u
              - csnd:SND
              - dsp::DSP
              - frd:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - http:C
              - ir:rst
              - ir:u
              - ir:USER
              - mic:u
              - ndm:u
              - news:u
              - nwm::UDS
              - ptm:u
              - pxi:dev
              - soc:U
              - ssl:C
              - y2r:u

          SystemControlInfo:
            SaveDataSize: 0KB
            RemasterVersion: 2
            StackSize: 0x40000

            Dependency:
              ac: 0x0004013000002402
              am: 0x0004013000001502
              boss: 0x0004013000003402
              camera: 0x0004013000001602
              cecd: 0x0004013000002602
              cfg: 0x0004013000001702
              codec: 0x0004013000001802
              csnd: 0x0004013000002702
              dlp: 0x0004013000002802
              dsp: 0x0004013000001a02
              friends: 0x0004013000003202
              gpio: 0x0004013000001b02
              gsp: 0x0004013000001c02
              hid: 0x0004013000001d02
              http: 0x0004013000002902
              i2c: 0x0004013000001e02
              ir: 0x0004013000003302
              mcu: 0x0004013000001f02
              mic: 0x0004013000002002
              ndm: 0x0004013000002b02
              news: 0x0004013000003502
              nim: 0x0004013000002c02
              nwm: 0x0004013000002d02
              pdn: 0x0004013000002102
              ps: 0x0004013000003102
              ptm: 0x0004013000002202
              ro: 0x0004013000003702
              socket: 0x0004013000002e02
              spi: 0x0004013000002302
              ssl: 0x0004013000002f02
          RSF
          ls -l cia_assets

      - name: Fabriquer le .cia
        shell: bash
        run: |
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -j bannertool.zip "linux-x86_64/bannertool" -d /opt/devkitpro/tools/bin
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18/makerom-v0.18-ubuntu_x86_64.zip
          unzip makerom-v0.18-ubuntu_x86_64.zip makerom -d /opt/devkitpro/tools/bin
          chmod a+x /opt/devkitpro/tools/bin/bannertool /opt/devkitpro/tools/bin/makerom
          bannertool makebanner -i cia_assets/banner.png -a cia_assets/audio.wav -o cia_assets/banner.bnr
          bannertool makesmdh -s "RPG 2DS" -l "Petit RPG avec éditeur intégré" -p "Moi" -i cia_assets/icon.png -f "nosavebackups,visible" -o cia_assets/icon.icn
          makerom -f cia -o rpg2ds.cia -target t -exefslogo -elf rpg2ds.elf -rsf cia_assets/app.rsf -banner cia_assets/banner.bnr -icon cia_assets/icon.icn

      - name: Garder les fichiers en artefact
        uses: actions/upload-artifact@v4
        with:
          name: rpg2ds
          path: |
            rpg2ds.3dsx
            rpg2ds.cia

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          files: |
            rpg2ds.3dsx
            rpg2ds.cia
