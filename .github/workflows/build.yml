name: Compiler le jeu 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Installer les bibliothèques 3DS
        run: dkp-pacman -Syu --noconfirm 3ds-dev || echo "Installation ignorée (déjà présent ?)"

      - name: Compiler
        run: make

      - name: Garder le fichier en artefact
        uses: actions/upload-artifact@v4
        with:
          name: rpg2ds
          path: rpg2ds.3dsx

      - name: Publier dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version
          files: rpg2ds.3dsx
